name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  X_RAY_VERSION: "25.10.15"

jobs:
  validate:
    name: Shared tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.418
          cache: true
          cache-dependency-path: src/TrafficLab.ProfileRunner/packages.lock.json

      - name: Validate shell entry points
        shell: bash
        run: |
          set -euo pipefail
          bash -n Linux/tlab Linux/bootstrap.sh Apk/gradlew

      - name: Validate PowerShell entry points
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          Get-ChildItem -Path . -Recurse -File -Filter '*.ps1' |
            Where-Object { $_.FullName -notmatch '[\\/](vendor|artifacts|releases|bin|obj)[\\/]' } |
            ForEach-Object {
              $tokens = $null; $errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count) { $failures += $errors }
            }
          if ($failures.Count) { $failures | Format-List; throw 'PowerShell syntax validation failed.' }

      - name: Locked restore, build and self-tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/TrafficLab.ProfileRunner/TrafficLab.ProfileRunner.csproj --locked-mode
          dotnet build src/TrafficLab.ProfileRunner/TrafficLab.ProfileRunner.csproj --configuration Release --framework net8.0 --no-restore
          dotnet run --project src/TrafficLab.ProfileRunner/TrafficLab.ProfileRunner.csproj --configuration Release --framework net8.0 --no-build -- --self-test

  windows:
    name: Windows portable x64
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.418
          cache: true
          cache-dependency-path: src/TrafficLab.ProfileRunner/packages.lock.json

      - name: Build checksummed portable archive
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'windows-release'
          & './Portable windows/build-portable.ps1' -RuntimeIdentifier win-x64 -XrayVersion $env:X_RAY_VERSION -OutputDirectory $out -Zip
          $app = Join-Path $out 'LokiTrafficLab-win-x64/LokiTrafficLab.exe'
          & $app --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Published Windows self-test failed.' }
          Copy-Item (Join-Path $out 'LokiTrafficLab-win-x64/manifest.json') (Join-Path $out 'windows-manifest.json') -Force
          $zip = Get-ChildItem $out -Filter 'LokiTrafficLab-windows-x64-*.zip' | Select-Object -Single
          $expected = ((Get-Content "$($zip.FullName).sha256" -Raw) -split '\s+')[0]
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Windows archive checksum verification failed.' }

      - name: Upload Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traffic-lab-windows
          path: |
            ${{ runner.temp }}/windows-release/LokiTrafficLab-windows-x64-*.zip
            ${{ runner.temp }}/windows-release/LokiTrafficLab-windows-x64-*.zip.sha256
            ${{ runner.temp }}/windows-release/windows-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  linux:
    name: Linux x64 and bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.418
          cache: true
          cache-dependency-path: src/TrafficLab.ProfileRunner/packages.lock.json

      - name: Build checksummed Linux archive
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'linux-release'
          & './Linux/build-linux.ps1' -RuntimeIdentifier linux-x64 -XrayVersion $env:X_RAY_VERSION -OutputDirectory $out -Archive
          Copy-Item (Join-Path $out 'LokiTrafficLab-linux-x64/manifest.json') (Join-Path $out 'linux-manifest.json') -Force

      - name: Smoke-test exact Linux binary and one-command installer
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/linux-release"
          export LD_LIBRARY_PATH="$out/LokiTrafficLab-linux-x64"
          "$out/LokiTrafficLab-linux-x64/LokiTrafficLab" --self-test
          "$out/LokiTrafficLab-linux-x64/LokiTrafficLab" collector --self-test
          archive="$(find "$out" -maxdepth 1 -name 'LokiTrafficLab-linux-x64-*.tar.gz' -print -quit)"
          test -n "$archive"
          docker run --rm -v "$out:/release:ro" ubuntu:24.04 bash -lc \
            "bash /release/bootstrap.sh --archive /release/$(basename "$archive") && tlab self-test && tlab status"

      - name: Upload Linux candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traffic-lab-linux
          path: |
            ${{ runner.temp }}/linux-release/LokiTrafficLab-linux-x64-*.tar.gz
            ${{ runner.temp }}/linux-release/LokiTrafficLab-linux-x64-*.tar.gz.sha256
            ${{ runner.temp }}/linux-release/bootstrap.sh
            ${{ runner.temp }}/linux-release/bootstrap.sh.sha256
            ${{ runner.temp }}/linux-release/linux-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  android:
    name: Android APK
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            Apk/gradle/wrapper/gradle-wrapper.properties
            Apk/app/gradle.lockfile

      - name: Build, test, lint and verify APK
        shell: pwsh
        run: |
          $project = Get-Content 'src/TrafficLab.ProfileRunner/TrafficLab.ProfileRunner.csproj' -Raw
          $version = [regex]::Match($project, '<Version>([^<]+)</Version>').Groups[1].Value
          & './Apk/build-apk.ps1' -XrayVersion $env:X_RAY_VERSION -Version $version
          $apk = Get-ChildItem './Apk/releases' -Filter "LokiTrafficLab-android-$version.apk" | Select-Object -Single
          $apksigner = './Apk/.android-sdk/build-tools/35.0.0/apksigner.bat'
          $aapt = './Apk/.android-sdk/build-tools/35.0.0/aapt.exe'
          & $apksigner verify --verbose --print-certs $apk.FullName
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed.' }
          $badging = (& $aapt dump badging $apk.FullName) -join "`n"
          if ($badging -notmatch "versionName='$([regex]::Escape($version))'") { throw 'APK version does not match project version.' }
          Copy-Item './Apk/releases/manifest.json' './Apk/releases/android-manifest.json' -Force

      - name: Upload Android candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traffic-lab-android
          path: |
            Apk/releases/LokiTrafficLab-android-*.apk
            Apk/releases/LokiTrafficLab-android-*.apk.sha256
            Apk/releases/android-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
